name: kutonoutche
description: "Application de géolocalisation des infrastructures et services publics à Cotonou"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI et Navigation
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3

  # Géolocalisation et cartes
  google_maps_flutter: ^2.5.0
  google_maps_cluster_manager: ^3.1.0
  google_polyline_algorithm: ^3.1.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  location: ^8.0.1

  # Base de données locale
  sqflite: ^2.3.3+2
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP et API
  http: ^1.1.0
  http_parser: ^4.0.2
  share_plus: ^12.0.1
  dio: ^5.7.0

  # Supabase (auth: OTP, mot de passe oublié)
  supabase_flutter: ^2.8.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  firebase_app_check: 0.4.1+2
  cloud_firestore: ^6.1.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # State Management
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3

  # Utilitaires
  shared_preferences: ^2.3.4
  image_picker: ^1.0.4
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  flutter_tts: ^4.2.2
  flutter_localizations:
    sdk: flutter

  # Widgets personnalisés
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.1
  flutter_staggered_animations: ^1.1.1
  flutter_local_notifications: ^19.4.0
  flutter_svg: ^2.0.10
  qr_flutter: ^4.1.0

  # Autres dépendances
  flutter_phoenix: ^1.1.1
  path_provider: ^2.1.1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

# Configuration pour l'icône de l'application
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"
  background_color: "#FFFFFF"

# Configuration pour l'écran de démarrage
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo1.png
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo1.png
    - assets/icons/
    - assets/data/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
